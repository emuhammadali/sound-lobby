name: sound_lobby
description: SoundLobby - A synchronized music lobby app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.9

  # Audio
  just_audio: ^0.10.2

  # HTTP
  http: ^1.4.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/soundlobby_app_icon.png"

flutter:
  assets:
    - assets/images/soundlobby_splash_image.png
    - assets/images/soundlobby_icon.png
  uses-material-design: true